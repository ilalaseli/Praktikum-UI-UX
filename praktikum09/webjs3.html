<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BELAJAR JS</title>
        <script>
            let buahs = ["Mangga", "Apel", "Pisang"];
            buahs.push("Jeruk");
            console.log("Buah Index ke -1" + buahs[1]);
            for(let i = 0; i < buahs.length; i++){
                console.log("Buah Index ke - " + i + " adalah " + buahs[i]);
            }
            function isidata(){
                let selectbuah = document.getElementById("buah");
                for(let i = 0; i < buahs.length; i++){
                    let optionbaru = document.createElement("option");
                    optionbaru.value = buahs[i];
                    optionbaru.text = buahs[i];
                    selectbuah.appendChild(optionbaru);
                }
            }
            function pilih(){
                let selectbuah = document.getElementById("buah");
                let buahterpilih = selectbuah.options[selectbuah.selectedIndex].value;
                console.log("Buah Terpilih: " + buahterpilih);
                alert("Buah Favorit Anda adalah " + buahterpilih);
            }
 
        </script>
    </head>
    <body onload="isidata()">
        <form>
            Pilih Buah Favorit Anda:
            <select id="buah" onchange="pilih()">
                <option value="Durian">Durian</option>
            </select>
        </form>
    </body>
</html>y
