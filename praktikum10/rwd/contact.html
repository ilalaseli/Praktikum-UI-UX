<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontak - MieAyamLezat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <div class="container py-4">
      <h2>Kontak & Pesan</h2>
      <div class="row g-4">
        <div class="col-lg-6">
          <h5>Pesan Sekarang</h5>
          <form id="orderFormPage">
            <div class="mb-2"><input class="form-control" name="nama" placeholder="Nama" required></div>
            <div class="mb-2"><input class="form-control" name="telp" placeholder="No. WhatsApp" required></div>
            <div class="mb-2"><textarea class="form-control" name="catatan" rows="4" placeholder="Catatan"></textarea></div>
            <div class="d-grid"><button class="btn btn-primary">Kirim</button></div>
          </form>
        </div>
        <div class="col-lg-6">
          <h5>Lokasi</h5>
          <div class="ratio ratio-16x9 mb-3"><iframe src="https://www.google.com/maps?q=Jakarta&output=embed" allowfullscreen></iframe></div>
          <p class="mb-1">Jalan Haji Atab</p>
          <p>WhatsApp: 0812-xxxx-xxxx | Email: info@mieayamlezat.id</p>
        </div>
      </div>

      <p class="mt-4"><a href="index.html">Kembali ke Home</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
